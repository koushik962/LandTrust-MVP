<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandTrust Citizen Portal | ল্যান্ডট্রাস্ট ডিজিটাল ভূমি সেবা</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f0f4f8; color: #2c3e50; min-height: 100vh; display: flex; flex-direction: column; }
        
        .app-header { background: linear-gradient(135deg, #0d3b2e 0%, #1b4d3e 100%); color: white; padding: 20px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-container { max-width: 900px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-title h1 { font-size: 22px; font-weight: 700; }
        .logo-title p { font-size: 13px; color: #a3e635; }
        .admin-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 600; }
        
        .main-container { max-width: 900px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        .search-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 14px 18px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: #27ae60; }
        .search-box button { background: #27ae60; color: white; border: none; padding: 14px 25px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
        
        .alert-card { background: #fef3c7; border-left: 5px solid #f59e0b; color: #92400e; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; display: none; }
        .welcome-card { background: white; padding: 40px 20px; text-align: center; border-radius: 16px; border: 1px solid #e2e8f0; color: #64748b; }
        
        .footer { text-align: center; padding: 20px; background: white; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0; margin-top: auto; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="logo-title">
                <h1>🌿 ল্যান্ডট্রাস্ট ডিজিটাল ভূমি সেবা</h1>
                <p>স্মার্ট উপায়ে ২০টি ডামি রেকর্ড ও মালিকানা সত্যতা যাচাই</p>
            </div>
            <a href="/admin" class="admin-btn">🔐 অ্যাডমিন প্যানেল</a>
        </div>
    </header>

    <main class="main-container">
        <div class="search-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="দাগ নম্বর, খতিয়ান বা রেকর্ড আইডি লিখুন (যেমন: p2, p5, 101)..." onkeypress="if(event.key === 'Enter') performSearch()">
                <button onclick="performSearch()">🔍 খুঁজুন</button>
            </div>
        </div>

        <div id="alertBox" class="alert-card"></div>

        <div id="welcomePlaceholder" class="welcome-card">
            <h3 style="color: #0d3b2e; margin-bottom: 8px;">যেকোনো রেকর্ড খুঁজতে উপরে আইডি লিখুন</h3>
            <p>আপনার ২০টি ডাটার মধ্যে থেকে সঠিক তথ্যটি নিচে কার্ড আকারে দেখতে পারবেন।</p>
        </div>

        <!-- সার্চ রেজাল্ট এই বক্সের মধ্যে যুক্ত হবে -->
        <div id="resultsContainer"></div>
    </main>

    <footer class="footer">
        <p>© ২০২৬ LandTrust Ecosystem | ডিজিটাল ভূমি তথ্য পোর্টাল</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}?v=final"></script>
</body>
</html>
