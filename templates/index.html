<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandTrust Citizen Portal | ল্যান্ডট্রাস্ট ডিজিটাল ভূমি সেবা</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-title">
                <span class="logo-icon">🌿</span>
                <div>
                    <h1 id="appTitle">ল্যান্ডট্রাস্ট ডিজিটাল ভূমি সেবা</h1>
                    <p id="appSubtitle">স্মার্ট উপায়ে জমির মালিকানা সত্যতা যাচাই ও জালিয়াতি প্রতিরোধ পোর্টাল</p>
                </div>
            </div>
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">
                🌐 <span id="langBtnText">English</span>
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="শুধু দাগ নম্বর, খতিয়ান বা মালিকের নাম লিখুন (যেমন: 101, 102, রহিম)...">
                <button onclick="performSearch()" id="searchBtn">🔍 তথ্য খুঁজুন</button>
            </div>
            <p class="search-hint" id="searchHint">💡 টিপস: আপনার জমার দাগ নম্বর বা খতিয়ান নম্বর দিয়ে খুঁজলে জমির ম্যাপ ও সুরক্ষা রিপোর্ট চলে আসবে।</p>
        </section>

        <div id="alertBox" class="alert-card" style="display: none;"></div>

        <!-- GIS Map Section -->
        <div class="card map-card">
            <div class="card-header">
                <h3 id="mapCardTitle">📍 ভূমির সঠিক অবস্থান ও সীমানা (GIS Map)</h3>
            </div>
            <div class="card-body">
                <div id="map"></div>
            </div>
        </div>

        <!-- Modules Tabs -->
        <div class="card module-card">
            <div class="tab-header">
                <button class="tab-btn active" id="tabDeeds" onclick="switchTab('DEEDS')">
                    📜 দলিল ও মালিকানা সত্যতা যাচাই
                </button>
                <button class="tab-btn" id="tabFraud" onclick="switchTab('FRAUD')">
                    🛡️ ক্রেতা সুরক্ষা ও জালিয়াতি প্রতিরোধ রিপোর্ট
                </button>
            </div>
            
            <div class="card-body">
                <!-- Deeds & Ownership Content -->
                <div id="viewDeeds" class="tab-content active">
                    <div id="deedsRecordsContainer" class="records-grid"></div>
                </div>

                <!-- Anti-Fraud Risk Content -->
                <div id="viewFraud" class="tab-content">
                    <div id="fraudRecordsContainer" class="records-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p id="footerText">© ২০২৬ LandTrust Ecosystem | নিরাপদ ভূমি লেনদেন সেবা</p>
    </footer>

    <!-- Leaflet JS & App JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
